spring:
  application:
    name: skypath-flight-search
  jackson:
    # Serialize java.time values as ISO-8601 strings rather than numeric timestamps,
    # so offset-aware instants stay readable in API responses.
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

skypath:
  dataset:
    # Accepts any Spring resource location, so a container or test can override this
    # with file:/path/to/flights.json without a code change.
    location: classpath:flights.json

logging:
  level:
    com.spotnana.flightsearch: INFO
